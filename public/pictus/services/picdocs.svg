<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1800" role="img" aria-label="PicDocs">
  <defs>
    <linearGradient id="pdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c16"/>
      <stop offset="1" stop-color="#101109"/>
    </linearGradient>
    <linearGradient id="pdBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B6E036" stop-opacity="0"/>
      <stop offset="1" stop-color="#B6E036" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1800" fill="url(#pdBg)"/>

  <!-- back document -->
  <g transform="rotate(-8 900 900)">
    <rect x="620" y="470" width="640" height="840" rx="40" fill="#20241b" stroke="#39402e" stroke-width="4"/>
  </g>

  <!-- front document -->
  <g>
    <rect x="590" y="500" width="640" height="860" rx="40" fill="#F8F8F8"/>
    <rect x="590" y="500" width="640" height="150" rx="40" fill="#B6E036"/>
    <rect x="590" y="610" width="640" height="40" fill="#B6E036"/>
    <!-- header text blocks -->
    <rect x="650" y="556" width="300" height="40" rx="20" fill="#141511" opacity="0.85"/>
    <!-- line items -->
    <g fill="#141511" opacity="0.14">
      <rect x="650" y="730" width="520" height="30" rx="15"/>
      <rect x="650" y="800" width="520" height="30" rx="15"/>
      <rect x="650" y="870" width="420" height="30" rx="15"/>
      <rect x="650" y="940" width="520" height="30" rx="15"/>
      <rect x="650" y="1010" width="360" height="30" rx="15"/>
    </g>
    <!-- amounts column -->
    <g fill="#141511" opacity="0.28">
      <rect x="1050" y="730" width="120" height="30" rx="15"/>
      <rect x="1050" y="800" width="120" height="30" rx="15"/>
      <rect x="1050" y="940" width="120" height="30" rx="15"/>
    </g>
    <!-- total -->
    <rect x="650" y="1150" width="260" height="46" rx="23" fill="#141511" opacity="0.85"/>
    <rect x="980" y="1150" width="190" height="46" rx="23" fill="#B6E036"/>
  </g>

  <!-- AI scan beam -->
  <rect x="560" y="930" width="700" height="10" rx="5" fill="url(#pdBeam)"/>

  <!-- AI confirmation check -->
  <g transform="translate(1180 1180)">
    <circle cx="0" cy="0" r="120" fill="#B6E036"/>
    <path d="M-54 6 L-14 50 L58 -44" fill="none" stroke="#141511" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AI sparkles -->
  <g fill="#B6E036">
    <path d="M520 560 l22 54 54 22 -54 22 -22 54 -22 -54 -54 -22 54 -22 z"/>
    <path d="M1300 760 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14 z" opacity="0.8"/>
  </g>
</svg>
